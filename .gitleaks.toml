title = "Technocore ProofKit public-repository policy"
minVersion = "8.30.1"

[extend]
useDefault = true

[[rules]]
id = "technocore-route-signature"
description = "Routeable Technocore protocol signature"
regex = '''(?i)(outbound_signature_b64u|signature_b64u|signature|["']sig["'])\s*["']?\s*:\s*["']([A-Za-z0-9_-]{86})["']'''
secretGroup = 2
keywords = ["outbound_signature_b64u", "signature_b64u", "signature", "sig"]

[[rules]]
id = "technocore-standalone-b64url-86"
description = "Any standalone 64-byte base64url value outside the verified attestation field"
regex = '''(?i)(?:^|[^A-Za-z0-9_-])([A-Za-z0-9_-]{86})(?:$|[^A-Za-z0-9_-])'''
secretGroup = 1

[[rules]]
id = "technocore-say-signed-url"
description = "Routeable Technocore say-signed URL"
regex = '''(?i)/say-signed/[^/\s"'?#]+/([A-Za-z0-9_-]{86})(?:/|[?#\s"'\\]|$)'''
secretGroup = 1
keywords = ["say-signed"]

[[rules]]
id = "technocore-domain-attestation"
description = "Domain-separated attestation outside the single sanitized evidence record"
regex = '''(?i)["']attestation_b64u["']\s*:\s*["']([A-Za-z0-9_-]{86})["']'''
secretGroup = 1
keywords = ["attestation_b64u"]

[[allowlists]]
description = "Public did:key identifiers are not credentials"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''did:key:z6Mk[1-9A-HJ-NP-Za-km-z]{44}\b'''
]

[[allowlists]]
description = "One verified domain-separated attestation in the sanitized evidence file"
targetRules = [
  "generic-api-key",
  "technocore-domain-attestation",
  "technocore-standalone-b64url-86"
]
condition = "AND"
regexTarget = "line"
paths = ['''^evidence/did-7b12b1399005a4c0\.json$''']
regexes = [
  '''^\s*"attestation_b64u"\s*:\s*"[A-Za-z0-9_-]{86}"\s*,?\s*$'''
]
