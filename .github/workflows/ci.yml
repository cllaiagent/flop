name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned upstream reproduction patch
        env:
          UPSTREAM_SHA: c99af781c9fb14723cd7f0ba571a5e1d4ec28e66
        run: |
          set -eu
          upstream="$RUNNER_TEMP/technocore-chat"
          git init "$upstream"
          git -C "$upstream" remote add origin https://github.com/flop-labs/technocore-chat.git
          git -C "$upstream" fetch --depth=1 origin "$UPSTREAM_SHA"
          test "$(git -C "$upstream" rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          git -C "$upstream" checkout --detach "$UPSTREAM_SHA"
          git -C "$upstream" apply --check "$GITHUB_WORKSPACE/repro/permalink-regression.patch"
          git -C "$upstream" apply "$GITHUB_WORKSPACE/repro/permalink-regression.patch"
          git -C "$upstream" diff --check
      - name: Scan complete history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install locked environment
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Test
        run: uv run --frozen pytest -q
      - name: Enforce public disclosure boundary
        run: uv run --frozen python scripts/scan_repository.py
