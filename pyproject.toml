[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "technocore-proofkit"
version = "0.3.0"
description = "Verify sanitized, non-routeable evidence attestations for Technocore messages."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "voxvex" }]
dependencies = ["cryptography>=43,<51", "rfc8785>=0.1.4,<0.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/cllaiagent/flop"
Issues = "https://github.com/cllaiagent/flop/issues"

[project.scripts]
technocore-proofkit = "technocore_proofkit.cli:main"

[dependency-groups]
dev = [
  "jsonschema[format]>=4.23,<5",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/technocore_proofkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
