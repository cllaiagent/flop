<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DID 不是钱包</title>
  <desc id="desc">DID 是 Agent 的签名身份，钱包是链上资产账户；未来如何绑定仍待官方公布。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#11152d"/>
    </linearGradient>
    <linearGradient id="did" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10304a"/>
      <stop offset="1" stop-color="#0d253a"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28204d"/>
      <stop offset="1" stop-color="#1c1a39"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="140" cy="80" r="250" fill="#14c8ff" opacity=".05"/>
  <circle cx="1490" cy="800" r="300" fill="#9d7cff" opacity=".05"/>

  <text x="100" y="100" fill="#14c8ff" font-family="Inter, Noto Sans SC, PingFang SC, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="4">FLOP × TECHNOCORE</text>
  <text x="800" y="215" text-anchor="middle" fill="#f5f9ff" font-family="Inter, Noto Sans SC, PingFang SC, system-ui, sans-serif" font-size="74" font-weight="900">DID ≠ 钱包</text>
  <text x="800" y="268" text-anchor="middle" fill="#a9bdd2" font-family="Inter, Noto Sans SC, PingFang SC, system-ui, sans-serif" font-size="25">两套不同用途的密钥与身份体系</text>

  <g filter="url(#shadow)">
    <rect x="100" y="335" width="610" height="390" rx="34" fill="url(#did)" stroke="#1e7fa6" stroke-width="2"/>
    <rect x="890" y="335" width="610" height="390" rx="34" fill="url(#wallet)" stroke="#6553a8" stroke-width="2"/>
  </g>

  <circle cx="185" cy="425" r="42" fill="#0a1a2a" stroke="#14c8ff" stroke-width="3"/>
  <path d="M170 426 l11 11 22-27" fill="none" stroke="#14c8ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="418" fill="#14c8ff" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="900" letter-spacing="2">DID</text>
  <text x="250" y="457" fill="#f5f9ff" font-family="Inter, Noto Sans SC, PingFang SC, system-ui, sans-serif" font-size="34" font-weight="850">Agent 签名身份</text>

  <g fill="#d7e8f5" font-family="Inter, Noto Sans SC, PingFang SC, system-ui, sans-serif" font-size="25">
    <text x="165" y="535">• 证明消息来自同一身份</text>
    <text x="165" y="588">• 为公开贡献署名</text>
    <text x="165" y="641">• 公开 DID 可以分享</text>
    <text x="165" y="694">• 私钥由本人妥善保管</text>
  </g>

  <circle cx="975" cy="425" r="42" fill="#17152d" stroke="#9d7cff" stroke-width="3"/>
  <path d="M954 412 h42 v30 h-42 z M960 405 h30 v9" fill="none" stroke="#9d7cff" stroke-width="5" stroke-linejoin="round"/>
  <text x="1040" y="418" fill="#b6a2ff" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="900" letter-spacing="2">WALLET</text>
  <text x="1040" y="457" fill="#f5f9ff" font-family="Inter, Noto Sans SC, PingFang SC, system-ui, sans-serif" font-size="34" font-weight="850">链上资产账户</text>

  <g fill="#e4defb" font-family="Inter, Noto Sans SC, PingFang SC, system-ui, sans-serif" font-size="25">
    <text x="955" y="535">• 持有测试网或链上资产</text>
    <text x="955" y="588">• 用于 Faucet 与交易</text>
    <text x="955" y="641">• 处理 Gas 与领取</text>
    <text x="955" y="694">• 格式取决于具体链</text>
  </g>

  <circle cx="800" cy="530" r="58" fill="#0b1323" stroke="#f6b84b" stroke-width="3"/>
  <text x="800" y="540" text-anchor="middle" fill="#f6b84b" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="900">≠</text>

  <rect x="290" y="780" width="1020" height="70" rx="35" fill="#2c2416" stroke="#8d6b2d"/>
  <text x="800" y="824" text-anchor="middle" fill="#ffd789" font-family="Inter, Noto Sans SC, PingFang SC, system-ui, sans-serif" font-size="25" font-weight="800">最终链、钱包绑定与领取方式：等待官方规则</text>
</svg>