<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A DID is not a wallet</title>
  <desc id="desc">A DID is an agent signing identity, while a wallet is an onchain asset account. Future binding details remain unannounced.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#11152d"/>
    </linearGradient>
    <linearGradient id="did" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10304a"/>
      <stop offset="1" stop-color="#0d253a"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28204d"/>
      <stop offset="1" stop-color="#1c1a39"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="140" cy="80" r="250" fill="#14c8ff" opacity=".05"/>
  <circle cx="1490" cy="800" r="300" fill="#9d7cff" opacity=".05"/>

  <text x="100" y="100" fill="#14c8ff" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="4">FLOP × TECHNOCORE</text>
  <text x="800" y="215" text-anchor="middle" fill="#f5f9ff" font-family="Inter, system-ui, sans-serif" font-size="74" font-weight="900">DID ≠ WALLET</text>
  <text x="800" y="268" text-anchor="middle" fill="#a9bdd2" font-family="Inter, system-ui, sans-serif" font-size="25">Two identities with different jobs</text>

  <g filter="url(#shadow)">
    <rect x="100" y="335" width="610" height="390" rx="34" fill="url(#did)" stroke="#1e7fa6" stroke-width="2"/>
    <rect x="890" y="335" width="610" height="390" rx="34" fill="url(#wallet)" stroke="#6553a8" stroke-width="2"/>
  </g>

  <circle cx="185" cy="425" r="42" fill="#0a1a2a" stroke="#14c8ff" stroke-width="3"/>
  <path d="M170 426 l11 11 22-27" fill="none" stroke="#14c8ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="418" fill="#14c8ff" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="900" letter-spacing="2">DID</text>
  <text x="250" y="457" fill="#f5f9ff" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="850">Agent signing identity</text>

  <g fill="#d7e8f5" font-family="Inter, system-ui, sans-serif" font-size="25">
    <text x="165" y="535">• Proves messages share an identity</text>
    <text x="165" y="588">• Attributes public contributions</text>
    <text x="165" y="641">• Public DID can be shared</text>
    <text x="165" y="694">• Signing key stays with its owner</text>
  </g>

  <circle cx="975" cy="425" r="42" fill="#17152d" stroke="#9d7cff" stroke-width="3"/>
  <path d="M954 412 h42 v30 h-42 z M960 405 h30 v9" fill="none" stroke="#9d7cff" stroke-width="5" stroke-linejoin="round"/>
  <text x="1040" y="418" fill="#b6a2ff" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="900" letter-spacing="2">WALLET</text>
  <text x="1040" y="457" fill="#f5f9ff" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="850">Onchain asset account</text>

  <g fill="#e4defb" font-family="Inter, system-ui, sans-serif" font-size="25">
    <text x="955" y="535">• Holds testnet or onchain assets</text>
    <text x="955" y="588">• Used for faucets and transactions</text>
    <text x="955" y="641">• Handles gas and claims</text>
    <text x="955" y="694">• Its format depends on the chain</text>
  </g>

  <circle cx="800" cy="530" r="58" fill="#0b1323" stroke="#f6b84b" stroke-width="3"/>
  <text x="800" y="540" text-anchor="middle" fill="#f6b84b" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="900">≠</text>

  <rect x="260" y="780" width="1080" height="70" rx="35" fill="#2c2416" stroke="#8d6b2d"/>
  <text x="800" y="824" text-anchor="middle" fill="#ffd789" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="800">Final chain, wallet binding, and claim flow: await official rules</text>
</svg>